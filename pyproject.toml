[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ride-visuals"
version = "0.1.0"
description = "Turn cycling activity archives into maps, telemetry graphics, and video"
readme = "README.md"
authors = [
    { name = "Henrique Lindemann" }
]
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "fitdecode>=0.11.0",
    "gpxpy>=1.6.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=4.1.0", "ruff>=0.16.5"]

[project.scripts]
ride-visuals = "ride_visuals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
